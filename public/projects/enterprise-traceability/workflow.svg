<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Workflows that can recover — fictional engineering illustration</title><desc id="desc">Editing · validation · API boundaries · interrupted operations. All information and interface arrangements are fictional; no production system is represented.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#182c36"/><stop offset="1" stop-color="#09151d"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#abcaca" stroke-opacity=".035"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4ed8ce" stroke-width="1.5"/></marker></defs><rect width="1200" height="760" fill="url(#bg)"/><rect width="1200" height="760" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="52" y="65" fill="#50d8cd" font-size="16" font-weight="600">03 / ENGINEERING STUDY</text><text x="52" y="120" fill="#f4f0e5" font-size="42" font-weight="700">Workflows that can recover</text><text x="52" y="159" fill="#b1c5cc" font-size="20" font-weight="400">Editing · validation · API boundaries · interrupted operations</text><rect x="52" y="199" width="1096" height="466" rx="10" fill="#0e1c25" stroke="#40535c"/><rect x="80" y="262" width="224" height="118" rx="10" fill="#17303a" stroke="#4ed8ce"/><text x="100" y="303" fill="#f0eee3" font-size="23" font-weight="600">Edit draft</text><text x="100" y="340" fill="#b3cbd0" font-size="16" font-weight="400">Fictional record</text><rect x="352" y="262" width="224" height="118" rx="10" fill="#17303a" stroke="#4ed8ce"/><text x="372" y="303" fill="#f0eee3" font-size="23" font-weight="600">Validate</text><text x="372" y="340" fill="#b3cbd0" font-size="16" font-weight="400">Explain missing values</text><rect x="624" y="262" width="224" height="118" rx="10" fill="#17303a" stroke="#4ed8ce"/><text x="644" y="303" fill="#f0eee3" font-size="23" font-weight="600">Submit</text><text x="644" y="340" fill="#b3cbd0" font-size="16" font-weight="400">Illustrative boundary</text><rect x="896" y="262" width="224" height="118" rx="10" fill="#17303a" stroke="#4ed8ce"/><text x="916" y="303" fill="#f0eee3" font-size="23" font-weight="600">Confirm</text><text x="916" y="340" fill="#b3cbd0" font-size="16" font-weight="400">Show outcome</text><path d="M306 321H345" fill="none" stroke="#4ed8ce" stroke-width="2" marker-end="url(#arrow)"/><path d="M578 321H617" fill="none" stroke="#4ed8ce" stroke-width="2" marker-end="url(#arrow)"/><path d="M850 321H889" fill="none" stroke="#4ed8ce" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="474" width="288" height="118" rx="10" fill="#17303a" stroke="#edb55c"/><text x="644" y="515" fill="#f0eee3" font-size="23" font-weight="600">Recover / retry</text><text x="644" y="552" fill="#b3cbd0" font-size="16" font-weight="400">Keep user input available</text><path d="M736 382V454" fill="none" stroke="#edb55c" stroke-width="2" stroke-dasharray="6 6"/><text x="762" y="425" fill="#edc27c" font-size="16" font-weight="400">If interrupted</text><path d="M624 532H464V399" fill="none" stroke="#4ed8ce" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="86" y="484" fill="#ebeee4" font-size="24" font-weight="600">Happy paths are only part</text><text x="86" y="520" fill="#ebeee4" font-size="24" font-weight="600">of the interface problem.</text><text x="86" y="563" fill="#b1c6cf" font-size="18" font-weight="400">Make the recovery path legible.</text><text x="80" y="632" fill="#a7c0c9" font-size="18" font-weight="400">Conceptual flow only — not an implementation or system architecture diagram.</text><path d="M52 698H1148" stroke="#42555b" fill="none"/><text x="52" y="729" fill="#9fb6bd" font-size="15" font-weight="600">ILLUSTRATIVE CONCEPT / FICTIONAL INTERFACE AND INVENTED DATA</text></g></svg>