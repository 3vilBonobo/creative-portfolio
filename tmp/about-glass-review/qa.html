<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>About glass refinement QA</title></head><body><div id="app"></div><script type="module">
const params=new URLSearchParams(location.search);
const real=window.matchMedia.bind(window);
if(params.has('reduce')) window.matchMedia=q=>q==='(prefers-reduced-motion: reduce)'?{matches:true,media:q,addEventListener(){},removeEventListener(){}}:real(q);
const [{createApp,h,nextTick},{default:About},{default:SiteNavigation},{default:FloorNavigator},{FLOORS},{aboutContent},{previewPhoneTouch}]=await Promise.all([import('vue'),import('/src/sections/AboutSection.vue'),import('/src/components/SiteNavigation.vue'),import('/src/components/FloorNavigator.vue'),import('/src/config/floors.ts'),import('/src/data/about.ts'),import('/src/composables/usePhoneLayout.ts')]);
await import('/src/style.css');
if(params.has('touch'))previewPhoneTouch.value=true;
if(params.has('long'))aboutContent.panels.toolkit.paragraphs.push(...Array(8).fill(aboutContent.panels.toolkit.paragraphs[0]));
createApp({render:()=>h('div',{class:'app-shell','data-active-floor':'about','data-time-phase':'night'},[h(SiteNavigation,{activeFloor:'about'}),h(FloorNavigator,{floors:FLOORS,activeFloor:'about'}),h('main',{id:'main-content'},[h(About)])])}).mount('#app');
await nextTick();await document.fonts.ready;
if(params.has('reduce')){let style=document.createElement('style');style.textContent='.about__profile-panel.is-active{animation:none!important}.about__tabs button{transition:none!important}';document.head.append(style);}
if(params.has('nofilter')){let style=document.createElement('style');style.textContent='.about__reading-surface{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:#101514f5!important}';document.head.append(style);}
if(params.has('text')){let sizes=[...document.querySelectorAll('#about,#about *')].map(x=>[x,parseFloat(getComputedStyle(x).fontSize)]);for(let [el,size] of sizes)el.style.setProperty('font-size',`${size*2}px`,'important');}
document.documentElement.dataset.qaReady='true';
</script></body></html>
