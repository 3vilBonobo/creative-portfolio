<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Floor 03 desktop master — temporary actual-component review</title></head>
<body><div id="app"></div><script type="module">
import {createApp,h} from 'vue';
import AboutSection from '/src/sections/AboutSection.vue';
import SiteNavigation from '/src/components/SiteNavigation.vue';
import FloorNavigator from '/src/components/FloorNavigator.vue';
import {FLOORS} from '/src/config/floors.ts';
import '/src/style.css';
const params=new URLSearchParams(location.search);
const fit=params.get('mode')!=='current';
document.body.classList.toggle('review-fit',fit);
document.body.classList.toggle('review-wide',params.get('zone')==='wide');
createApp({render:()=>h('div',{class:'app-shell','data-time-phase':'day','data-active-floor':'about'},[
 h(SiteNavigation),h(FloorNavigator,{floors:FLOORS,activeFloor:'about'}),h('main',{id:'main-content'},[h(AboutSection)])
])}).mount('#app');
const geometry=await fetch('./package/geometry.json').then(r=>r.json());
const section=document.querySelector('#about');
const art=document.createElement('img');art.className='review-background';art.alt='';art.setAttribute('aria-hidden','true');art.src='./package/candidate/floor-03-about-corridor-desktop-clean-preview.webp';section.prepend(art);
const photoURL=new URL('./package/references/actual-site-portrait.webp',location.href).href;
section.querySelectorAll('.about__portrait source').forEach(e=>e.srcset=photoURL);
section.querySelector('.about__portrait img').src=photoURL;
const style=document.createElement('style');style.textContent=`
#about .about__architecture{visibility:hidden}
.review-background{position:absolute;left:0;top:0;width:100%;height:auto;z-index:0;pointer-events:none}
.review-fit #about{padding:0;border:0;min-height:var(--review-plate-height);background:#161917;overflow:hidden}
.review-fit #about::before,.review-fit #about::after{display:none}
.review-fit #about .about__layout{position:relative;z-index:2;display:block;width:100%;max-width:none;margin:0;padding:var(--review-content-top) 0 64px}
.review-fit.review-wide #about .about__narrative,.review-fit.review-wide #about .about__secondary{width:36%}
.review-fit #about .about__narrative{position:static;width:32%;max-width:none;padding:0;margin:0 0 0 7.5%;background:none;border:0;box-shadow:none}
.review-fit #about .about__identity{position:static;display:block;transform:none!important;opacity:1!important}
.review-fit #about .about__portrait{position:absolute;inset:0 auto auto 0;z-index:2;width:320px;height:540px;aspect-ratio:auto;margin:0;border:0;background:none;box-shadow:none;filter:none;opacity:1;transform-origin:0 0;mask-image:none;-webkit-mask-image:none}
.review-fit #about .about__portrait::before,.review-fit #about .about__portrait::after{display:none}
.review-fit #about .about__portrait img{filter:none;mix-blend-mode:normal;object-fit:cover;object-position:51% 18%}
.review-fit #about .about__rail{position:absolute;z-index:2;left:70%;top:var(--review-label-top);width:8%;padding:0;margin:0;border:0;color:#f2e6d3;pointer-events:none}
.review-fit #about .about__rail>span,.review-fit #about .about__rail>small,.review-fit #about .about__floor-dots{display:none}
.review-fit #about .about__rail strong{font-size:var(--review-label-size);line-height:1}
.review-fit #about .about__heading{font-size:clamp(64px,5vw,96px)!important;line-height:1!important;margin:12px 0 20px}
.review-fit #about .about__identity>.about__introduction{margin:0;font-size:18px;line-height:1.65;max-width:none;color:#f0e8dc}
.review-fit #about .about__background{margin:24px 0 0;padding:0;border:0;max-width:none}
.review-fit #about .about__background p{font-size:16px;line-height:1.7;margin:0 0 18px}
.review-fit #about .about__secondary{width:32%;margin:24px 0 0 7.5%;align-self:stretch;opacity:1!important;transform:none!important}
.review-fit #about .about__panels{min-height:0;padding:18px}
.review-fit #about .about__panels p:not(.about__label){font-size:16px;line-height:1.7}
.review-fit #about .about__principle p{font-size:16px!important;line-height:1.7}
.review-fit #about .about__tabs button{min-height:44px;font-size:11px}
`;document.head.append(style);
function homography(w,hh,quad){const from=[[0,0],[w,0],[w,hh],[0,hh]],A=[],b=[];for(let i=0;i<4;i++){const [x,y]=from[i],[u,v]=quad[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);}for(let i=0;i<8;i++){let p=i;for(let j=i+1;j<8;j++)if(Math.abs(A[j][i])>Math.abs(A[p][i]))p=j;[A[p],A[i]]=[A[i],A[p]];[b[p],b[i]]=[b[i],b[p]];const d=A[i][i];for(let k=i;k<8;k++)A[i][k]/=d;b[i]/=d;for(let j=0;j<8;j++)if(j!==i){let f=A[j][i];for(let k=i;k<8;k++)A[j][k]-=f*A[i][k];b[j]-=f*b[i];}}const [a,c,e,bb,d,f,g,hh1]=b;return `matrix3d(${a},${bb},0,${g},${c},${d},0,${hh1},0,0,1,0,${e},${f},0,1)`;}
function layout(){const w=section.getBoundingClientRect().width,scale=w/1920;section.style.setProperty('--review-plate-height',`${1080*scale}px`);section.style.setProperty('--review-content-top',`${1080*scale*.15}px`);section.style.setProperty('--review-label-top',`${1080*scale*.238}px`);section.style.setProperty('--review-label-size',`${1080*scale*.1}px`);if(fit)section.querySelector('.about__portrait').style.transform=homography(320,540,geometry.portrait_aperture.export_pixels.map(([x,y])=>[x*scale,y*scale]));}
layout();addEventListener('resize',layout);new ResizeObserver(layout).observe(section);
</script></body></html>
