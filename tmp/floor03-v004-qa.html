<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Floor 03 v004 local QA</title>
<style>
#floor03-qa{position:fixed;z-index:99999;bottom:2px;left:2px;background:#111e;color:#eee;font:11px sans-serif;max-width:94vw;padding:5px}
#floor03-qa label{display:block;margin:4px}#floor03-qa input,#floor03-qa textarea,#floor03-qa button,#floor03-qa select{font:11px sans-serif;color:#eee;background:#252d2c;border:1px solid #8ed8d0}
#floor03-qa textarea{width:180px;height:25px}#floor03-qa button{padding:4px}
</style></head><body><div id="app"></div>
<details id="floor03-qa"><summary>Floor 03 QA</summary>
<label>Lamp <select id="qa-lamp"><option value="1">On</option><option value="0">Off</option></select></label>
<label><input id="qa-long" type="checkbox">Longer biography</label>
<label><input id="qa-text" type="checkbox">200% text simulation</label>
<button id="qa-top">About start</button><button id="qa-bottom">About end</button>
<label>Evidence filename <input id="qa-name"></label>
<label>Screenshot payload <textarea id="qa-data"></textarea></label>
<button id="qa-save">Save screenshot</button><output id="qa-status" aria-live="polite"></output>
</details>
<script type="module">
const reduced = new URLSearchParams(location.search).get('motion') === 'reduce';
document.documentElement.dataset.qaReducedMotion = String(reduced);
if (reduced) {
  const originalMatchMedia = window.matchMedia.bind(window);
  window.matchMedia = query => {
    const result = originalMatchMedia(query);
    if (!query.includes('prefers-reduced-motion')) return result;
    return new Proxy(result, { get(target, property) {
      if (property === 'matches') return query.includes('reduce') && !query.includes('no-preference');
      const value = Reflect.get(target, property, target);
      return typeof value === 'function' ? value.bind(target) : value;
    }});
  };
}
document.documentElement.dataset.qaReducedMatch = String(window.matchMedia('(prefers-reduced-motion: reduce)').matches);
await import('/src/main.ts');
const ready = setInterval(() => {
  const section = document.querySelector('#about');
  if (!section) return;
  clearInterval(ready);
  if (reduced) {
    const declarations = [];
    const visit = rules => { for(const rule of rules) {
      if (rule.conditionText?.includes('prefers-reduced-motion: reduce')) declarations.push(...[...rule.cssRules].map(x=>x.cssText));
      else if (rule.cssRules) visit(rule.cssRules);
    }};
    for(const sheet of document.styleSheets) {try{visit(sheet.cssRules);}catch{}}
    const style = document.createElement('style');
    style.dataset.reducedMotionSimulation = 'true';
    style.textContent = declarations.join('\n');
    document.head.append(style);
  }
  document.querySelector('#qa-lamp').onchange = event => section.style.setProperty('--about-light-intensity',event.target.value);
  const background = section.querySelector('.about__background');
  document.querySelector('#qa-long').onchange = event => {
    background.querySelectorAll('[data-qa-copy]').forEach(x=>x.remove());
    if(event.target.checked) for(let i=0;i<6;i++) {
      const copy=background.children[i%2].cloneNode(true);copy.dataset.qaCopy='true';background.append(copy);
    }
  };
  let sizes = [];
  document.querySelector('#qa-text').onchange = event => {
    if(event.target.checked) {
      sizes=[...section.querySelectorAll('.about__layout *')].map(element=>({element,original:element.style.fontSize,size:parseFloat(getComputedStyle(element).fontSize)}));
      sizes.forEach(({element,size})=>element.style.setProperty('font-size',`${size*2}px`,'important'));
    } else sizes.forEach(({element,original})=>original?element.style.fontSize=original:element.style.removeProperty('font-size'));
  };
  document.querySelector('#qa-top').onclick=()=>section.scrollIntoView({behavior:'instant',block:'start'});
  document.querySelector('#qa-bottom').onclick=()=>section.scrollIntoView({behavior:'instant',block:'end'});
  document.querySelector('#qa-save').onclick=async()=>{
    const result=await fetch('/__floor03-evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:document.querySelector('#qa-name').value,data:document.querySelector('#qa-data').value})});
    document.querySelector('#qa-status').textContent=await result.text();
    document.querySelector('#qa-data').value='';
  };
  section.scrollIntoView({behavior:'instant',block:'start'});
},100);
</script></body></html>
