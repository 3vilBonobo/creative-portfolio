<!doctype html><meta charset="utf-8"><title>Local review evidence</title><label>Filename <input id="name"></label><label>Evidence <textarea id="data"></textarea></label><button id="save">Save</button><output role="status"></output><script>document.querySelector('#save').onclick=async()=>{const r=await fetch('/__about-corridor-evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:document.querySelector('#name').value,data:document.querySelector('#data').value})});document.querySelector('output').textContent=await r.text();};</script>
