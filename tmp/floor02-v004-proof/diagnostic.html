<!doctype html><html lang="en"><head><meta charset="utf-8"><title>v004 image diagnostics</title><style>body{background:#222;color:#eee;font:14px monospace;margin:16px}#images{display:flex;gap:20px}figure{margin:0;width:300px}img{width:300px;height:850px;object-fit:fill}pre{white-space:pre-wrap}</style></head><body><h1>Actual v004 production continuations</h1><pre id="report">Decoding staged assets…</pre><div id="images"></div><script type="module">
const root='/art-production/staging/floor-02-projects/v004/production/public/environments/floor-02-projects/';
const results=[];
for(const profile of ['desktop','mobile']) {
 const image=new Image();image.src=root+`floor-02-projects-wall-continuation-${profile}.webp`;await image.decode();
 const figure=document.createElement('figure');figure.append(document.createTextNode(profile+' — compressed vertical overview'),image);document.querySelector('#images').append(figure);
 const canvas=document.createElement('canvas');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;const context=canvas.getContext('2d',{willReadFrequently:true});context.drawImage(image,0,0);
 const {data}=context.getImageData(0,0,canvas.width,canvas.height);const w=canvas.width,h=canvas.height;
 const periods=[];
 for(const period of [64,128,256]){let sum=0,n=0;for(let y=0;y<h-period;y+=8){for(let x=0;x<w;x+=8){for(let c=0;c<3;c++){sum+=Math.abs(data[(y*w+x)*4+c]-data[((y+period)*w+x)*4+c]);n++;}}}periods.push({period,meanAbsoluteChannelDifference:sum/n});}
 let edge=0,n=0;for(let x=0;x<w;x++){for(let c=0;c<3;c++){edge+=Math.abs(data[x*4+c]-data[((h-1)*w+x)*4+c]);n++;}}
 results.push({profile,width:w,height:h,periods,topBottomEdgeDifference:edge/n,decodedRGBABytes:w*h*4});
}
document.querySelector('#report').textContent=JSON.stringify(results,null,2);
</script></body></html>
