<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor 01 accessibility simulation</title>
    <script>
      // Local QA fixture only: text enlargement and coarse-pointer simulation
      // without installing dependencies or changing production behavior.
      const settings = new URLSearchParams(location.search);
      if (settings.has('text200')) document.documentElement.style.fontSize = '32px';
      const nativeMatchMedia = window.matchMedia.bind(window);
      window.matchMedia = query => nativeMatchMedia(query
        .replace('(any-pointer: coarse)', '(min-width: 0px)')
        .replace(settings.has('motion') ? '(prefers-reduced-motion: reduce)' : '__no_match__', '(min-width: 0px)'));
    </script>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
