<!doctype html><meta charset="utf-8"><title>Local design evidence</title><label>Filename <input id="filename"></label><label>Screenshot <textarea id="data"></textarea></label><button id="save">Save</button><output id="status" role="status"></output><script>document.querySelector('#save').onclick=async()=>{const r=await fetch('/__about-design-evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:document.querySelector('#filename').value,data:document.querySelector('#data').value})});document.querySelector('#status').textContent=await r.text();};</script>
